name: CI

# Runs the full verification matrix on every push / PR / manual trigger.
# Mirrors the "final verification" gate from docs/VERIFICATION.md §5.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PYTHON: "3.12"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}

      - name: Install zsh (cross-shell syntax check for run.sh)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh

      - name: Install dependencies
        # camoufox is heavy and not required by the self-contained test suites,
        # so a failure to install it does NOT break CI (tests are stdlib-only).
        run: pip install -r requirements.txt 2>/dev/null || true

      # ── 1. compile ────────────────────────────────────────────────────────
      - name: Compile all .py
        run: |
          python -m py_compile \
            src/*.py src/*/*.py scripts/*.py tests/*.py

      # ── 2. import + symbol cross-check ────────────────────────────────────
      - name: Import & symbol verification
        run: |
          python - <<'EOF'
          import importlib
          checks = {
            "src.export": {"manifest","mark"},
            "src.export.manifest": ["build_manifest","write_manifest"],
            "src.export.mark": ["export_video","export_all","_to_mark_format"],
            "src.pipeline.identity": ["resolve_identity"],
            "src.pipeline.stages": ["StageRunner"],
            "src.pipeline.improve": ["PipelineMetrics","ImprovementPlan",
                                     "Action","ImprovementPlanner","SelfHealingPipeline"],
          }
          ok = True
          for mod, syms in checks.items():
            m = importlib.import_module(mod)
            miss = [s for s in syms if not hasattr(m, s)]
            if miss: ok = False; print(f"FAIL {mod} missing {miss}")
          if not ok: raise SystemExit("symbol check failed")
          print("all symbols present")
          EOF

      # ── 3. shell compatibility of run.sh (bash + zsh) ─────────────────────
      - name: run.sh syntax — bash
        run: bash -n run.sh
      - name: run.sh syntax — zsh
        run: zsh -n run.sh

      # ── 4. test suites (self-contained, stdlib-only) ─────────────────────
      # Every deterministic suite under tests/ runs, discovered by glob so a
      # new suite is gated the moment it lands (previously only 2 of 13 ran).
      - name: Run deterministic test suites
        run: |
          set -eu
          found=0
          for suite in tests/test_*.py tests/run_*_tests.py; do
            [ -e "$suite" ] || continue
            found=$((found + 1))
            echo "▶ $suite"
            python "$suite"
          done
          if [ "$found" -eq 0 ]; then
            echo "❌ no test suites discovered under tests/"; exit 1
          fi
          echo "✅ all $found deterministic suites passed"

      # ── 5. security: no plaintext credentials ────────────────────────────
      - name: No LINKEDIN password/username in source
        run: |
          if grep -rnI 'LINKEDIN_PASSWORD\|LINKEDIN_USERNAME' \
            --exclude-dir=__pycache__ \
            --exclude-dir=.pytest_cache \
            src/ tests/ scripts/; then
            echo "❌ plaintext credentials found"; exit 1
          fi
          echo "✅ no plaintext credentials in code"
      - name: venv activate no stale repo path
        run: |
          ! grep -q 'tiktok-pipeline' .venv/bin/activate 2>/dev/null \
            && echo "✅ venv path current" || echo "⚠ venv activate needs refresh"

      # ── 6. ponytail ladder gate — the rung that is mechanically checkable ──
      # A gate that cannot fail is decoration. This one fails the build on
      # deferred-work markers in shipping code (see docs/PONYTAIL.md).
      - name: Ponytail ladder gate — no deferred-work markers in src/scripts
        run: |
          if grep -rnIE '\b(TODO|FIXME|XXX|HACK)\b' src/ scripts/ \
            --exclude-dir=__pycache__; then
            echo "❌ deferred-work marker found — finish it, or record a"
            echo "   'ponytail:' ceiling + a docs/PONYTAIL.md deferred entry."
            exit 1
          fi
          echo "✅ no TODO/FIXME/XXX/HACK in src/ or scripts/"

      # ── 7. ponytail-ledger gate — inline ceiling markers must be ledgered ──
      # Every `ponytail:` marker in src/ + scripts/ must have a matching
      # entry in docs/PONYTAIL.md §6, so the next contributor sees the whole
      # contract (ceiling + upgrade path), not half of it.
      - name: Ponytail ledger gate — every ponytail: marker has a debt entry
        run: python scripts/check_ponytail_ledger.py

      # ── 8. third-party dependency gate — undeclared imports block merge ───
      # AST-scan src/ + scripts/; any import outside stdlib / repo /
      # requirements.txt (active or documented-commented optional) fails CI.
      - name: Dependency gate — no undeclared third-party imports
        run: python scripts/check_dependencies.py
