name: Versioning

# CI/CD *versioning* automation — validates every semver tag against the
# MVP-v1 contract in docs/VERSIONING.md and gates platform additions.
# Scope policy: TikTok + LinkedIn only until stable (no new platform before 1.x).
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Proposed next version (semver, e.g. 1.1.0)'
        required: true

env:
  SCHEMA_VERSION: "1.0"

jobs:
  verify-tag:
    name: Validate semver tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          TAG="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: v$TAG"

      - name: Validate semver (X.Y.Z or X.Y.Z-prerelease)
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?($|\+)'
          if [ $? -ne 0 ]; then
            echo "❌ tag 'v$TAG' is not a valid semver → vX.Y.Z"; exit 1
          fi

      - name: Cross-check VERSIONING.md
        run: |
          # docs/VERSIONING.md is the single source of MVP-v1 truth:
          # scope = TikTok + LinkedIn only, stabilize gate documented.
          grep -q "1.0.0 (MVP v1)" docs/VERSIONING.md
          grep -qi "TikTok + LinkedIn" docs/VERSIONING.md
          echo "✅ VERSIONING.md consistent with tag scope"

  release-notes:
    name: Generate release notes
    runs-on: ubuntu-latest
    needs: verify-tag
    condition: always() && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect commits since last tag
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then
            RANGE="HEAD"
          else
            RANGE="$LAST..HEAD"
          fi
          git log "$RANGE" --pretty=format:'- %s (%an)' \
            -- docs/ src/ tests/ run.sh .github/workflows/ > release_notes.txt 2>/dev/null || true
          echo "## Release notes (auto-generated from change-set)" > release.md
          echo '```' >> release.md
          cat release_notes.txt >> release.md
          echo '```' >> release.md
          cat release.md

  prevent-new-platform-before-stable:
    name: Platform addition guard
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')
    steps:
      - uses: actions/checkout@v4
      - name: Reject new provider before 1.x stable
        run: |
          # MVP v1 rule: only TikTok + LinkedIn. No new src/providers/* before 1.0.
          new_providers=$(git diff --name-only --diff-filter=A \
            "$(git describe --tags --abbrev=0 2>/dev/null || echo 4b80e6b)^!" \
            src/providers/ 2>/dev/null | wc -l)
          if [ "$new_providers" -gt 0 ]; then
            echo "❌ new provider added before TikTok+LinkedIn stabilized"; exit 1
          fi
          echo "✅ no new platform before 1.0 — scope policy enforced"
