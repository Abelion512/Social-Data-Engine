name: Versioning

# CI/CD *versioning* automation — semver gates + auto bump (major|minor|patch).
# Scope policy: TikTok + LinkedIn only until stable (no new provider before 1.x).
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: false
        default: 'check'
        type: choice
        options:
          - check        # just validate current versions + docs consistency
          - bump         # auto-bump major|minor|patch (commits + tags + pushes)
      bump:
        description: 'Which semver part to bump (for action=bump)'
        required: false
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

env:
  SCHEMA_VERSION: "1.0"

permissions:
  contents: write    # needed to commit + tag + push

jobs:
  verify-tag:
    name: Validate semver tag (on tag push)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Read tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          TAG="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: v$TAG"

      - name: Validate semver (X.Y.Z or X.Y.Z-prerelease)
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?($|\+)'
          if [ $? -ne 0 ]; then
            echo "❌ tag 'v$TAG' is not a valid semver → vX.Y.Z"; exit 1
          fi

      - name: Cross-check VERSIONING.md
        run: |
          grep -q "1.0.0 (MVP v1)" docs/VERSIONING.md
          grep -qi "TikTok + LinkedIn" docs/VERSIONING.md
          echo "✅ VERSIONING.md consistent with tag scope"

  release-notes:
    name: Generate release notes
    runs-on: ubuntu-latest
    needs: verify-tag
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect commits since last tag
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then
            RANGE="HEAD"
          else
            RANGE="$LAST..HEAD"
          fi
          git log "$RANGE" --pretty=format:'- %s (%an)' \
            -- docs/ src/ scripts/ tests/ run.sh .github/workflows/ > release_notes.txt 2>/dev/null || true
          echo "## Release notes (auto-generated)" > release.md
          echo '```' >> release.md
          cat release_notes.txt >> release.md
          echo '```' >> release.md
          cat release.md

  prevent-new-platform-before-stable:
    name: Platform addition guard
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject new provider before 1.0 stable
        run: |
          new_providers=$(git diff --name-only --diff-filter=A \
            "$(git describe --tags --abbrev=0 2>/dev/null || echo fcb007e)^!" \
            src/providers/ 2>/dev/null | wc -l)
          if [ "$new_providers" -gt 0 ]; then
            echo "❌ new provider added before TikTok+LinkedIn stabilized"; exit 1
          fi
          echo "✅ no new platform before 1.0 — scope policy enforced"

  suggest-bump:
    name: Bump suggestion (commits since last tag)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # needs full history + tags for describe/log
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run suggest_bump report
        run: |
          python -m py_compile scripts/suggest_bump.py
          python scripts/suggest_bump.py
          echo "ℹ️ informational only — apply via action=bump after live-test gate"

  versioning-check:
    name: Versioning check (workflow_dispatch / manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # suggest_bump needs tags + commit history
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-bump verification gate
        run: |
          echo "=== current semver constants ==="
          grep -n 'PIPELINE_VERSION =' src/schema/mapper.py
          grep -n 'SCHEMA_VERSION =\|COLLECTOR_VERSION =' src/tiktok_schema.py
          echo "=== compile + parser check ==="
          python -m py_compile scripts/version_bump.py
          python -c 'import importlib.util; s=importlib.util.spec_from_file_location("v","scripts/version_bump.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print("current →", ".".join(map(str,m._read_current())))'
          echo "=== cross-check VERSIONING.md scope ==="
          grep -qi "TikTok + LinkedIn" docs/VERSIONING.md && echo "✅ scope policy in docs"
          echo "=== bump suggestion from commits since last tag ==="
          python scripts/suggest_bump.py --json

  auto-version-bump:
    name: Auto bump (major|minor|patch)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'bump'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Downgrade guard (chosen < suggested?)
        env:
          BUMP_PART: ${{ github.event.inputs.bump }}
        run: |
          SUGGESTED=$(python scripts/suggest_bump.py --json \
            | python -c 'import json,sys; print(json.load(sys.stdin)["suggested_bump"])')
          RANK="major=3 minor=2 patch=1"
          CHOSE=$(echo "$RANK" | grep -o "$BUMP_PART=[0-9]" | cut -d= -f2)
          WANT=$(echo "$RANK"  | grep -o "$SUGGESTED=[0-9]" | cut -d= -f2)
          echo "chosen=$BUMP_PART ($CHOSE)  suggested=$SUGGESTED ($WANT)"
          if [ "$CHOSE" -lt "$WANT" ]; then
            echo "❌ chosen bump '$BUMP_PART' is LOWER than suggested '$SUGGESTED'";
            echo "   commits since last tag include higher-signal changes."; exit 1
          fi
          echo "✅ chosen bump >= suggested — proceed"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump + commit + tag + push
        env:
          BUMP_PART: ${{ github.event.inputs.bump }}
        run: |
          python scripts/version_bump.py --bump "$BUMP_PART" --commit --push
          NEW=$(python -c 'import importlib.util,sys; s=importlib.util.spec_from_file_location("v","scripts/version_bump.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print(".".join(map(str,m._read_current())))')
          echo "new_pipeline_version=$NEW" >> "$GITHUB_ENV"

      - name: Create GitHub Release (auto changelog)
        env:
          VERSION: ${{ env.new_pipeline_version }}
        run: |
          LAST_TAG="v$(python -c 'import importlib.util; s=importlib.util.spec_from_file_location("v","scripts/version_bump.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print(".".join(map(str,m._read_current())))')"
          # release notes already generated by release-notes job for real tags;
          # here just confirm tag pushed
          git tag -l "v$VERSION" && echo "✅ tag v$VERSION pushed"
